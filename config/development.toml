# Spreadable Development Configuration
# This file contains safe defaults for local development and paper trading

[exchange]
# Polymarket CLOB API endpoints
websocket_url = "wss://clob.polymarket.com/ws"
rest_api_url = "https://clob.polymarket.com/api/v1"

# API credentials (loaded from environment variables)
api_key = "${POLYMARKET_API_KEY}"
api_secret = "${POLYMARKET_API_SECRET}"

# Connection settings
reconnect_interval_ms = 1000
max_reconnect_interval_ms = 60000
heartbeat_interval_ms = 30000
heartbeat_timeout_ms = 10000

[strategy]
# Active strategy: "basic_mm", "adaptive_spread", or "ml_enhanced"
active = "basic_mm"

# Quote refresh interval (how often to recalculate and update quotes)
quote_refresh_interval_ms = 2000

[strategy.basic_mm]
# Fixed spread market-making with inventory skew
base_spread_bps = 500        # 5% spread (conservative for development)
quote_size = 10.0            # $10 per order
max_position = 100.0         # Maximum $100 position per market
skew_factor = 0.5            # Inventory skew adjustment (0.0-1.0)

[strategy.adaptive_spread]
# Dynamic spread based on volatility
base_spread_bps = 300
volatility_multiplier = 1.5
max_spread_bps = 1000
min_spread_bps = 200
quote_size = 10.0
max_position = 100.0

[strategy.ml_enhanced]
# Ollama-powered strategy with baseline fallback
ollama_endpoint = "${OLLAMA_ENDPOINT}"
model_name = "market-maker-v1"
inference_timeout_ms = 500
fallback_strategy = "basic_mm"
confidence_threshold = 0.7
quote_size = 10.0
max_position = 100.0

[risk]
# Position limits
max_position_per_market = 100.0    # Maximum $100 position per market
max_total_exposure = 500.0          # Maximum $500 total exposure across all markets
max_order_size = 20.0               # Maximum $20 per order

# Loss limits
max_daily_loss = 50.0               # Maximum $50 daily loss

# Spread enforcement
min_spread_bps = 200                # Minimum 2% spread enforced

# CRITICAL: Paper trading mode
paper_trading_mode = true           # MUST be true for development

[risk.circuit_breaker]
enabled = true
daily_loss_threshold = 50.0         # Trigger if daily loss >= $50
loss_rate_pct = 0.05                # Trigger if 5% loss in window
loss_rate_window_secs = 900         # 15-minute window for loss rate
websocket_timeout_secs = 60         # Trigger if WebSocket disconnected > 60s

[markets]
# List of enabled market IDs (hex strings)
# Start with empty array, add markets after testing
enabled = []

# Example (uncomment and add real market IDs):
# enabled = [
#     "0x1234567890abcdef1234567890abcdef12345678",
#     "0xabcdefabcdefabcdefabcdefabcdefabcdef1234"
# ]

[database]
# PostgreSQL connection (loaded from environment)
postgres_url = "${DATABASE_URL}"

# Connection pool settings
max_connections = 10
min_connections = 2
connection_timeout_secs = 30
idle_timeout_secs = 600

# Query settings
statement_timeout_ms = 5000

[monitoring]
# Prometheus metrics endpoint
metrics_bind_addr = "0.0.0.0:9090"

# Health check endpoint
health_bind_addr = "0.0.0.0:8080"

# Metrics collection interval
metrics_interval_ms = 1000

[logging]
# Log level: "error", "warn", "info", "debug", "trace"
level = "${RUST_LOG}"

# Log format: "json" or "pretty"
format = "pretty"

# Log to file
file_path = "logs/spreadable.log"
file_rotation = "daily"
file_max_size_mb = 100

[ml]
# Ollama integration (for User Story 4)
ollama_endpoint = "http://localhost:11434"
model_name = "market-maker-v1"
inference_enabled = false           # Disable ML until US4 implementation
inference_timeout_ms = 500
max_retries = 3
