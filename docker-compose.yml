version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: spreadable-postgres
    environment:
      POSTGRES_USER: spreaduser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: spreadable
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spreaduser -d spreadable"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - spreadable

  prometheus:
    image: prom/prometheus:latest
    container_name: spreadable-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - spreadable
    depends_on:
      - postgres

  grafana:
    image: grafana/grafana:latest
    container_name: spreadable-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana_data:/var/lib/grafana
    networks:
      - spreadable
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  spreadable:
    driver: bridge
